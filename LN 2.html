<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LN</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:#100e17;color:#eee8f0}
.stage{padding:20px;max-width:100vw}
.drawing{font:clamp(12px,3.1vw,22px)/1.8 "Courier New",monospace;white-space:pre}
.line{height:1.8em;white-space:pre}
.char{display:inline-block;transform-origin:50% 85%}
.l{animation:stepL 1.3s ease-in-out infinite, driftL 4.2s ease-in-out infinite}
.r{animation:stepR 1.3s ease-in-out infinite, driftR 4.2s ease-in-out infinite}
.heart{color:#e8a8c4;display:inline-block;transform-origin:center;animation:heartJourney 4.2s ease-in-out infinite}
.dots{color:#a99bad;display:inline-block;animation:drift 1.3s ease-in-out infinite}
@keyframes stepL{0%,100%{translate:0 0;rotate:-4deg}25%{translate:0 -4px;rotate:5deg}50%{translate:0 0;rotate:-2deg}75%{translate:0 -3px;rotate:4deg}}
@keyframes stepR{0%,100%{translate:0 -2px;rotate:4deg}25%{translate:0 0;rotate:-4deg}50%{translate:0 -5px;rotate:5deg}75%{translate:0 0;rotate:-3deg}}
/* Both figures dance apart, pause, then find their way back to the starting point. */
@keyframes driftL{0%{transform:translateX(0)}38%,52%{transform:translateX(-clamp(70px, 22vw, 160px))}68%,100%{transform:translateX(0)}}
@keyframes driftR{0%{transform:translateX(0)}38%,52%{transform:translateX(clamp(70px, 22vw, 160px))}68%,100%{transform:translateX(0)}}
@keyframes heartJourney{0%,68%,100%{transform:scale(1);opacity:.8}38%,52%{transform:scale(3.8);opacity:1}}
@keyframes drift{0%,100%{opacity:.25;letter-spacing:0}50%{opacity:.9;letter-spacing:2px}}
@media(prefers-reduced-motion:reduce){.char,.heart,.dots{animation-duration:4s}}
</style>
</head>
<body>
<main class="stage" aria-label="Two little figures dance apart and then return to each other">
<div class="drawing">
<div class="line"> <span class="char l">o</span>            <span class="char r">o</span></div><div class="line"><span class="char l">/|\\</span>  <span class="heart">♡</span>  <span class="dots">· ·</span>  <span class="char r">/|\\</span></div><div class="line"><span class="char l">/ \\</span>          <span class="char r">/ \\</span></div>
</div>
</main>
</body>
</html>
